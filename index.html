<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número del Día</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .fecha {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .numero-container {
            position: relative;
            display: inline-block;
            margin: 1rem 0;
        }
        
        .numero {
            font-size: 8rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            animation: pulse 2s infinite alternate;
        }
        
        .estrella {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: caer linear infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            }
            100% {
                transform: scale(1.05);
                text-shadow: 0 0 30px rgba(255, 215, 0, 1);
            }
        }
        
        @keyframes caer {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .info {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .fecha {
                font-size: 1.2rem;
            }
            
            .numero {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Número del Día</h1>
        <div class="fecha" id="fecha">Cargando...</div>
        <div class="numero-container">
            <div class="numero" id="numero">--</div>
        </div>
        <div class="info" id="timestamp"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
